<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotelia | Gestión hotelera</title>
  <style>
    :root { --navy:#102a43; --blue:#1677ff; --sky:#eff6ff; --ink:#172b4d; --muted:#62748a; --line:#dce6f2; --white:#fff; --danger:#db3a34; }
    * { box-sizing:border-box; } body { margin:0; background:#f5f8fc; color:var(--ink); font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { color:#fff; background:linear-gradient(120deg,#102a43,#175b9f); padding:42px clamp(20px,6vw,92px) 70px; } header p { margin:8px 0 0; opacity:.82; } h1 { margin:0; font-size:clamp(28px,4vw,42px); letter-spacing:-1px; }
    main { max-width:1200px; margin:-34px auto 44px; padding:0 20px; } .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:24px; }
    .stat,.panel { background:var(--white); border:1px solid var(--line); border-radius:14px; box-shadow:0 9px 25px rgba(22,53,90,.07); } .stat { padding:18px; } .stat strong { display:block; color:var(--blue); font-size:27px; } .stat span { color:var(--muted); font-size:13px; }
    .tabs { display:flex; overflow:auto; gap:7px; margin:20px 0; padding:4px; } .tab { border:0; background:transparent; padding:10px 15px; color:var(--muted); font-weight:700; cursor:pointer; border-radius:8px; white-space:nowrap; } .tab.active { background:var(--navy); color:white; }
    .workspace { display:grid; grid-template-columns:360px 1fr; gap:20px; } .panel { padding:22px; } h2 { font-size:19px; margin:0 0 18px; } .subtext { color:var(--muted); margin:-12px 0 18px; font-size:13px; }
    form { display:grid; gap:13px; } label { display:grid; gap:6px; color:#40536d; font-size:13px; font-weight:700; } input,select,textarea { width:100%; border:1px solid #cbd8e8; border-radius:8px; padding:10px; color:var(--ink); font:inherit; background:#fff; } textarea { resize:vertical; min-height:76px; } input:focus,select:focus,textarea:focus { outline:3px solid #ddebff; border-color:var(--blue); }
    .buttons { display:flex; gap:8px; margin-top:3px; } button { border:0; border-radius:8px; padding:10px 14px; cursor:pointer; font:inherit; font-weight:700; } .primary { color:#fff; background:var(--blue); } .secondary { color:var(--ink); background:#e8eff7; } .danger { color:var(--danger); background:#fff0ef; }
    .list { display:grid; gap:12px; } .card { display:flex; justify-content:space-between; align-items:flex-start; gap:15px; border:1px solid var(--line); border-radius:10px; padding:15px; } .card h3 { margin:0 0 5px; font-size:16px; } .card p { color:var(--muted); margin:0; font-size:13px; line-height:1.5; } .card-actions { display:flex; gap:6px; } .card-actions button { padding:7px 9px; font-size:12px; } .empty { color:var(--muted); text-align:center; padding:40px 10px; }
    #toast { position:fixed; right:20px; bottom:20px; color:#fff; background:#193f68; padding:13px 17px; border-radius:9px; box-shadow:0 12px 30px #102a4355; transform:translateY(90px); opacity:0; transition:.25s; } #toast.show { transform:translateY(0); opacity:1; } #toast.error { background:#b72d27; }
    @media (max-width:820px) { .stats { grid-template-columns:repeat(2,1fr); } .workspace { grid-template-columns:1fr; } header { padding-bottom:55px; } } @media (max-width:430px) { .stats { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><h1>Hotelia</h1><p>Panel de gestión de hoteles y reservaciones</p></header>
  <main>
    <section class="stats" id="stats"></section>
    <nav class="tabs" id="tabs"></nav>
    <section class="workspace">
      <article class="panel"><h2 id="form-title">Nuevo registro</h2><p class="subtext" id="form-help"></p><form id="entity-form"></form></article>
      <article class="panel"><h2 id="list-title">Registros</h2><input id="list-search" type="search" placeholder="Buscar hotel, ubicación o registro"><div class="list" id="entity-list"></div></article>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="api.js"></script><script src="admin.js"></script>
</body>
</html>

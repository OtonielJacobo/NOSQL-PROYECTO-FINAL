<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotelia | Panel de Administración</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M16 21v-2a4 4 0 0 0-4-4H4"/><path d="M7 21v-4a8 8 0 0 1 8-8v0a8 8 0 0 1 8 8v4"/><path d="M10 9l2-2 2 2"/><path d="M12 7v8"/></svg>
        <span>Hotelia</span>
      </div>
      <span class="badge">Admin</span>
    </div>
    
    <nav class="sidebar-nav" id="tabs">
      <!-- Tabs injected by JS -->
    </nav>
    
    <div class="sidebar-footer">
      <a href="index.html" class="btn btn-secondary w-100" style="gap: var(--space-sm);">
        Salir
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      </a>
    </div>
  </aside>

  <!-- Main Dashboard Content -->
  <main class="admin-main">
    <header class="admin-header">
      <div>
        <h1>Resumen del Panel</h1>
        <p class="text-muted">Gestiona tus propiedades, usuarios y reservaciones.</p>
      </div>
    </header>

    <!-- Stats Grid -->
    <section class="stats-grid" id="stats">
      <!-- Stats injected by JS -->
    </section>

    <!-- Workspace Area -->
    <section class="workspace">
      
      <!-- List Panel -->
      <article class="panel panel-list">
        <div class="panel-header">
          <h2 id="list-title">Registros</h2>
          <div class="search-wrapper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="list-search" type="search" placeholder="Buscar registros...">
          </div>
        </div>
        <div class="list-container" id="entity-list">
          <!-- List injected by JS -->
        </div>
      </article>

      <!-- Form Panel -->
      <article class="panel panel-form">
        <div class="panel-header">
          <h2 id="form-title">Nuevo Registro</h2>
          <p class="subtext" id="form-help"></p>
        </div>
        <form id="entity-form" class="admin-form">
          <!-- Form injected by JS -->
        </form>
      </article>

    </section>
  </main>

  <!-- Global Toast -->
  <div id="toast" role="status">
    <span class="toast-icon"></span>
    <span class="toast-message"></span>
  </div>

  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotelia | Encuentra tu hotel ideal</title>
  <style>
    :root { --navy:#102a43; --blue:#1677ff; --sky:#eff6ff; --ink:#172b4d; --muted:#62748a; --white:#fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f8fc; color: var(--ink); font-family: system-ui, sans-serif; }
    
    header { background: linear-gradient(120deg, #102a43, #175b9f); color: white; padding: 20px 0; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
    .nav-container h1 { margin: 0; font-size: 24px; }
    .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
    
    .hero { text-align: center; padding: 60px 20px; }
    .hero h2 { font-size: 36px; margin: 0 0 10px; }
    .hero p { font-size: 18px; opacity: 0.9; }

    main { max-width: 1200px; margin: -20px auto 40px; padding: 0 20px; }
    .hotel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }
    
    .hotel-card { background: var(--white); border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; }
    .hotel-img { height: 200px; background: #cbd8e8; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 40px; }
    .hotel-info { padding: 20px; flex-grow: 1; border-bottom: 1px solid #eee; }
    .hotel-info h3 { margin: 0 0 8px; font-size: 22px; color: var(--navy); }
    .hotel-info p { margin: 4px 0; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .estrellas { color: #fbbf24; font-size: 18px; letter-spacing: 2px; }
    
    .habitaciones-container { padding: 15px 20px; background: #fafcff; }
    .habitacion-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #dce6f2; }
    .habitacion-item:last-child { border-bottom: none; }
    .hab-tipo { font-weight: 600; color: var(--ink); }
    .hab-precio { color: #2e8b57; font-weight: bold; }
    .btn-reservar { background: var(--blue); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-reservar:hover { background: #0b5cce; }
    
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--muted); font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <h1>🏨 Hotelia</h1>
      <div class="nav-links">
        <a href="#">Inicio</a>
        <!-- Este botón lleva al trabajo que hizo Otoniel -->
        <a href="admin.html" style="background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px;">Acceso Admin</a>
      </div>
    </div>
    <div class="hero">
      <h2>Encuentra tu alojamiento ideal</h2>
      <p>Compara precios y reserva las mejores habitaciones.</p>
    </div>
  </header>

  <main>
    <div class="hotel-grid" id="lista-hoteles">
      <div class="empty-state">Cargando hoteles disponibles...</div>
    </div>
  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
